# Octomaton's own CI and release, run by Octomaton. Schema: README.md.
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group, and validate deploy/ and
  # deploy/logs/ as written, with Go's caches from main's last run or the pull request's own.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      # A pull request's run saves Go's caches for its next runs; a merge group's saves none
      # (docs/octomaton/designs/ci-caches.md).
      cache: "{{ if .PullRequest }}pull-requests/{{ .PullRequest.Number }}{{ end }}"
    timeout: 30m

  # Publish the images of every push to main, tagged with the commit's short SHA (also the version the
  # binaries report). A host may deploy every commit on main with the images of that commit (deploy/), so
  # main runs on every push: never give it a paths filter.
  - name: main
    pipelineRun: .tekton/main.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Argo CD runs the images of whatever commit main is at: only the newest waiting push needs building.
    concurrency:
      group: main
      policy: latest

  # A version: a v* tag (v1.2.3, which publishing a GitHub release creates) adds its name to the tagged
  # commit's images, once the tag is confirmed to be a version and the commit to be on main. Nothing is rebuilt.
  - name: tag
    pipelineRun: .tekton/tag.yaml
    on:
      push:
        tags: ["v*"]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      tag: "{{ .Tag }}"
    timeout: 20m
