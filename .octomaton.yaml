# Octomaton's own CI and release, run by Octomaton. Schema: README.md.
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group, and validate deploy/ and
  # deploy/logs/ as written.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m

  # Publish the images of every push to main, tagged with the commit's short SHA (also the version the
  # binaries report) and "main", and of every version tag (v1.2.3, which publishing a GitHub release creates),
  # tagged with the version. A host may deploy every commit on main with the images of that commit (deploy/), so
  # release runs on every push: never give it a paths filter.
  - name: release
    pipelineRun: .tekton/release.yaml
    on:
      push:
        branches: [main]
        tags: ["v*"]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      tag: "{{ .Tag }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting release may run. A tag's pushes form a group
    # of their own.
    concurrency:
      group: "release-{{ .Ref }}"
      policy: latest
