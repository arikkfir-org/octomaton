# Octomaton's own CI and release, run by Octomaton. Schema: README.md.
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request into main and every merge queue group, and validate the hub's
  # deployment (deploy/).
  - name: ci
    pipelineRun: .tekton/ci.yaml
    on:
      pull_request:
        branches: [main]
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m

  # Publish the image of every push to main, tagged with the commit's short SHA (also the version the
  # binary reports) and "main". There are no version tags. Argo CD deploys every commit on main with the image
  # of that commit (deploy/), so release runs on every push: never give it a paths filter.
  - name: release
    pipelineRun: .tekton/release.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting release may run.
    concurrency:
      group: "release-{{ .Ref }}"
      policy: latest
