# Octomaton's own CI and release, run by Octomaton. Schema: README.md.
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group, and validate the hub's deployment
  # (deploy/).
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m

  # Publish the image of every push to main, tagged with the commit's short SHA (also the version the
  # binary reports) and "main". There are no version tags. Argo CD deploys every commit on main with the image
  # of that commit (deploy/), so release runs on every push: never give it a paths filter.
  - name: release
    pipelineRun: .tekton/release.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting release may run.
    concurrency:
      group: "release-{{ .Ref }}"
      policy: latest

  # Publish the pull request reviewer's image (images/reviewer, run by arikkfir-org/tooling's reviewer) from main,
  # tagged with the commit's short SHA and "main", whenever it changes. Unlike release, it has a paths filter: tooling
  # pins the image by digest, so nothing runs whatever main is at.
  - name: reviewer-image
    pipelineRun: .tekton/reviewer-image.yaml
    on:
      push:
        branches: [main]
        paths: [images/reviewer/**, .tekton/reviewer-image.yaml]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting publication may run.
    concurrency:
      group: reviewer-image
      policy: latest

  # Build the reviewer's image for pull requests that change it, without pushing it.
  - name: reviewer-image-check
    displayName: Reviewer Image
    pipelineRun: .tekton/reviewer-image-check.yaml
    on:
      pull_request:
        paths: [images/reviewer/**, .tekton/reviewer-image-check.yaml]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
