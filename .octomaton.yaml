# Octomaton's own CI and release, run by Octomaton. Schema: README.md.
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group, and validate deploy/ and
  # deploy/logs/ as written.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m

  # Publish the images of every push to main, tagged with the commit's short SHA (also the version the
  # binaries report) and "main". There are no version tags. A host may deploy every commit on main with the images
  # of that commit (deploy/), so release runs on every push: never give it a paths filter.
  - name: release
    pipelineRun: .tekton/release.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting release may run.
    concurrency:
      group: "release-{{ .Ref }}"
      policy: latest


# "/rerun [check...]" on a pull request re-runs its failed checks, or the named ones, for those listed.
commands:
  rerun:
    allow:
      users: [arikkfir]
