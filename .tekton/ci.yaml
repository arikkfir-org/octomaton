# Switchboard's CI: lint its own .switchboard.yaml, vet, test (with the race
# detector) and build. A plain Tekton PipelineRun; Switchboard sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: switchboard-ci-
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to test.
    workspaces:
      - name: source
    tasks:
      - name: ci
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          volumes:
            - name: go-cache
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: GOCACHE
                value: /go-cache/build
              - name: GOMODCACHE
                value: /go-cache/mod
              - name: GOTOOLCHAIN
                value: local
              - name: GOFLAGS
                value: -mod=readonly
            volumeMounts:
              - name: go-cache
                mountPath: /go-cache
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet --detach FETCH_HEAD
                git log -1 --format='Testing %H: %s'
            - name: lint
              image: golang:1.27.1
              script: |
                #!/bin/sh
                set -eu
                go run ./cmd/switchboard lint .
            - name: vet
              image: golang:1.27.1
              script: |
                #!/bin/sh
                set -eu
                go vet ./...
            - name: test
              image: golang:1.27.1
              script: |
                #!/bin/sh
                set -eu
                go test -race ./...
            - name: build
              image: golang:1.27.1
              env:
                - name: CGO_ENABLED
                  value: "0"
              script: |
                #!/bin/sh
                set -eu
                go build -trimpath -o /tmp/switchboard ./cmd/switchboard
                /tmp/switchboard version
