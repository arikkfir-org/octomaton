# Octomaton's CI: lint its own .octomaton.yaml, render and validate deploy/ and deploy/logs/ as written, vet, test
# (with the race detector) and build, in task ci (ci.task.yaml). A plain Tekton PipelineRun; Octomaton sets the params.
# Go's caches come from bucket arikkfir-octomaton-ci-cache (docs/octomaton/designs/ci-caches.md): a pull request's run
# restores its own, or main's, and saves its own; a merge group's restores main's and saves none. As ci-octomaton-ci,
# which any branch may use and which may write only pull requests' caches, never main's.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: octomaton-ci-
spec:
  taskRunTemplate:
    serviceAccountName: ci-octomaton-ci
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  # Lint, vet, race tests and build peaked at 2.1Gi and 3.6 cores: a run gets a 4-vCPU CI node to itself.
  taskRunSpecs:
    - pipelineTaskName: ci
      computeResources:
        requests:
          cpu: "3"
          memory: 3Gi
        limits:
          memory: 4Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to test.
      - name: cache
        type: string
        description: Where this run saves Go's caches, pull-requests/<number>; empty saves none.
    workspaces:
      - name: source
    tasks:
      - name: ci
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: cache
            value: $(params.cache)
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: ci # .tekton/ci.task.yaml
