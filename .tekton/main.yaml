# Octomaton's build of main: build and push the images of a commit with ko,
# octomaton and octomaton-logs, tagged with the commit's short SHA (also the
# version the binaries report). A version (a v* tag) adds its tag to these
# images: .tekton/tag.yaml. The pod authenticates to Artifact Registry through
# Workload Identity (ko's Google keychain uses Application Default Credentials)
# as ci-octomaton-release, the one ServiceAccount allowed to push, which only
# main and v* tags may use (octomaton.dev/branches, octomaton.dev/tags).
# It also restores main's Go caches from bucket arikkfir-octomaton-ci-cache,
# builds with them, warms what ci compiles, and saves them back
# (docs/octomaton/designs/ci-caches.md). Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: octomaton-main-
spec:
  taskRunTemplate:
    serviceAccountName: ci-octomaton-release
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  # ko's build peaked at 2.5Gi and 3.7 cores.
  taskRunSpecs:
    - pipelineTaskName: build
      computeResources:
        requests:
          cpu: "3"
          memory: 3Gi
        limits:
          memory: 4Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to release.
    workspaces:
      - name: source
    tasks:
      - name: build
        # A lost node (an upgrade or a repair) kills the build. Argo CD runs the images of every commit on main, so try
        # again: pushing the same tags twice is harmless.
        retries: 2
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          volumes:
            - name: go-cache
              emptyDir: {}
            - name: tools
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: GOCACHE
                value: /go-cache/build
              - name: GOMODCACHE
                value: /go-cache/mod
              - name: GOTOOLCHAIN
                value: local
              # As ci's, so that ci reuses what main compiles (docs/octomaton/designs/ci-caches.md).
              - name: GOFLAGS
                value: -mod=readonly
            volumeMounts:
              - name: go-cache
                mountPath: /go-cache
              - name: tools
                mountPath: /tools
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet --detach "$REVISION"
            # Go's caches (docs/octomaton/designs/ci-caches.md): the first of RESTORE's archives that exists, streamed
            # into /go-cache. Without one, the run downloads and compiles everything. Go marks a build-cache entry it
            # uses by its modification time, at most once an hour: dated two hours back here, each entry this run uses
            # shows it, and save keeps only those.
            - name: restore
              image: docker.io/curlimages/curl:8.22.0
              securityContext:
                runAsUser: 0
              env:
                - name: RESTORE
                  value: main
              script: |
                #!/bin/sh
                set -eu
                token="$(curl -fsS -H 'Metadata-Flavor: Google' \
                  http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token |
                  sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p')"
                bucket=https://storage.googleapis.com/storage/v1/b/arikkfir-octomaton-ci-cache
                for cache in ${RESTORE}; do
                  object="$(printf '%s/go.tar.gz' "${cache}" | sed 's|/|%2F|g')"
                  if (set -o pipefail; curl -sf -w '%{stderr}%{http_code}' -H "Authorization: Bearer ${token}" \
                    "${bucket}/o/${object}?alt=media" 2>/tmp/status | tar -xzf - -C /go-cache); then
                    echo "Restored ${cache}/go.tar.gz"
                    break
                  fi
                  rm -rf /go-cache/build /go-cache/mod
                  case "$(cat /tmp/status)" in
                    404) echo "No ${cache}/go.tar.gz yet" ;;
                    200) echo "${cache}/go.tar.gz didn't unpack" ;;
                    *) echo "${cache}/go.tar.gz unreadable (HTTP $(cat /tmp/status))" ;;
                  esac
                done
                restored="$(( $(date +%s) - 7200 ))"
                if [ -d /go-cache/build ]; then
                  find /go-cache/build -path '/go-cache/build/??/*' -type f -exec touch -d "@${restored}" {} + ||
                    echo "Couldn't date /go-cache/build: save may drop entries this run uses"
                fi
                touch /go-cache/.restored
            # ko's release binary, at the Makefile's version, checked against its SHA-256: built with go run, its
            # modules and packages would fill Go's caches, which keep only what Octomaton builds with.
            - name: ko
              image: docker.io/curlimages/curl:8.22.0
              securityContext:
                runAsUser: 0
              env:
                - name: KO_VERSION
                  value: 0.19.1
                - name: KO_SHA256
                  value: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
              script: |
                #!/bin/sh
                set -eu
                curl -fsSL -o /tmp/ko.tar.gz \
                  "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz"
                echo "${KO_SHA256}  /tmp/ko.tar.gz" | sha256sum -c -
                tar -xzf /tmp/ko.tar.gz -C /tools ko
            - name: publish
              image: golang:1.27.1
              env:
                - name: REVISION
                  value: $(params.revision)
                - name: KO_DOCKER_REPO
                  value: me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton
              script: |
                #!/bin/sh
                set -eu
                VERSION=$(printf '%s' "$REVISION" | cut -c1-7)
                export VERSION
                echo "Publishing $KO_DOCKER_REPO:$VERSION"
                /tools/ko build --bare --tags "$VERSION" ./cmd/octomaton
            # The step logs server, from the same checkout and Go cache: Argo CD runs both images of every commit.
            - name: publish-logs
              image: golang:1.27.1
              env:
                - name: REVISION
                  value: $(params.revision)
                - name: KO_DOCKER_REPO
                  value: me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton-logs
              script: |
                #!/bin/sh
                set -eu
                VERSION=$(printf '%s' "$REVISION" | cut -c1-7)
                export VERSION
                echo "Publishing $KO_DOCKER_REPO:$VERSION"
                /tools/ko build --bare --tags "$VERSION" ./cmd/octomaton-logs
            # What ci compiles, built as it builds it (.tekton/ci.yaml), into the caches save keeps: lint's binary, what
            # vet checks against, the tests with the race detector (linked, never run) and the static binaries. A
            # warm-up that fails costs later runs time, never this run its result.
            - name: warm
              image: golang:1.27.1
              script: |
                #!/bin/sh
                set -eu
                go run ./cmd/octomaton-lint -version >/dev/null || echo "Couldn't warm lint"
                go vet ./... || echo "Couldn't warm vet"
                go test -race -count=1 -run '^$' -exec /bin/true ./... >/dev/null || echo "Couldn't warm the tests"
                CGO_ENABLED=0 go build -trimpath -o /tmp/bin/ ./cmd/... || echo "Couldn't warm the build"
            # Go's caches as this run restored and added to them, for the next runs
            # (docs/octomaton/designs/ci-caches.md), trimmed to what Octomaton builds with: the build-cache entries this
            # run used (restore dated the rest two hours back), and the modules go.sum names, unpacked, without their
            # zips, which Go doesn't read once a module is unpacked, or their test data. A cache it can't trim or save
            # costs later runs time, never this run its result.
            - name: save
              image: docker.io/curlimages/curl:8.22.0
              securityContext:
                runAsUser: 0
              env:
                - name: SAVE
                  value: main
              script: |
                #!/bin/sh
                set -eu
                token="$(curl -fsS -H 'Metadata-Flavor: Google' \
                  http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token |
                  sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p')"
                bucket=https://storage.googleapis.com/upload/storage/v1/b/arikkfir-octomaton-ci-cache
                # go.sum's modules as the module cache spells them, a capital as ! and its lower case.
                sed -n 's|^\([^ ]*\) \([^ /]*\) .*|\1@\2|p' go.sum | sed 's/[A-Z]/!&/g' | tr A-Z a-z >/tmp/modules
                cd /go-cache
                if [ ! -d build ] || [ ! -d mod ]; then
                  echo "Nothing to save as ${SAVE}/go.tar.gz"
                  exit 0
                fi
                if [ -s /tmp/modules ] && ! (
                  find build -path 'build/??/*' -type f ! -newer .restored -delete &&
                    chmod -R u+w mod && rm -rf mod/cache/download/sumdb &&
                    find mod/cache/download -name '*.zip' -delete &&
                    find mod -path mod/cache -prune -o -type d -name testdata -prune -exec rm -rf {} + &&
                    (cd mod && find . -path ./cache -prune -o -type d -name '*@*' -prune -print) |
                    sed 's|^\./||' | grep -vxF -f /tmp/modules | (cd mod && xargs -r rm -rf)
                ); then
                  echo "Couldn't trim Go's caches"
                fi
                if ! (set -o pipefail; tar -cf - build mod | gzip -1 >/tmp/go.tar.gz); then
                  echo "Couldn't archive Go's caches"
                  exit 0
                fi
                object="$(printf '%s/go.tar.gz' "${SAVE}" | sed 's|/|%2F|g')"
                status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -T /tmp/go.tar.gz \
                  -H "Authorization: Bearer ${token}" -H 'Content-Type: application/gzip' \
                  "${bucket}/o?uploadType=media&name=${object}" || true)"
                if [ "${status}" = 200 ]; then
                  echo "Saved ${SAVE}/go.tar.gz: $(du -h /tmp/go.tar.gz | cut -f1)"
                else
                  echo "Couldn't save ${SAVE}/go.tar.gz (HTTP ${status})"
                fi
