# Octomaton's build of main: build and push the images of a commit with ko,
# octomaton and octomaton-logs, tagged with the commit's short SHA (also the
# version the binaries report), in task main (main.task.yaml). A version (a v*
# tag) adds its tag to these images: .tekton/tag.yaml. The pod authenticates to
# Artifact Registry through Workload Identity (ko's Google keychain uses
# Application Default Credentials) as ci-octomaton-release, the one
# ServiceAccount allowed to push, which only main and v* tags may use
# (octomaton.dev/branches, octomaton.dev/tags). It also restores main's Go
# caches from bucket arikkfir-octomaton-ci-cache, builds with them, warms what
# ci compiles, and saves them back (docs/octomaton/designs/ci-caches.md).
# Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: octomaton-main-
spec:
  taskRunTemplate:
    serviceAccountName: ci-octomaton-release
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  # ko's build peaked at 2.5Gi and 3.7 cores.
  taskRunSpecs:
    - pipelineTaskName: build
      computeResources:
        requests:
          cpu: "3"
          memory: 3Gi
        limits:
          memory: 4Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to release.
    workspaces:
      - name: source
    tasks:
      - name: build
        # A lost node (an upgrade or a repair) kills the build. Argo CD runs the images of every commit on main, so try
        # again: pushing the same tags twice is harmless.
        retries: 2
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: main # .tekton/main.task.yaml
