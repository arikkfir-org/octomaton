# Octomaton's release: build and push the image of a commit on main with ko,
# tagged with the commit's short SHA (also the version the binary reports) and
# main. The pod authenticates to Artifact Registry through Workload Identity
# (ko's Google keychain uses Application Default Credentials). Octomaton sets
# the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: octomaton-release-
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to release.
    workspaces:
      - name: source
    tasks:
      - name: release
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          volumes:
            - name: go-cache
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: GOCACHE
                value: /go-cache/build
              - name: GOMODCACHE
                value: /go-cache/mod
              - name: GOTOOLCHAIN
                value: local
            volumeMounts:
              - name: go-cache
                mountPath: /go-cache
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet --detach FETCH_HEAD
            - name: publish
              image: golang:1.27.1
              env:
                - name: REVISION
                  value: $(params.revision)
                - name: KO_DOCKER_REPO
                  value: me-west1-docker.pkg.dev/arikkfir/images/octomaton
              script: |
                #!/bin/sh
                set -eu
                VERSION=$(printf '%s' "$REVISION" | cut -c1-7)
                export VERSION
                echo "Publishing $KO_DOCKER_REPO with tags $VERSION and main"
                go run github.com/google/ko@v0.19.1 build --bare --tags "$VERSION,main" ./cmd/octomaton
