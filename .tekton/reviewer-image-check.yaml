# Builds the pull request reviewer's image (images/reviewer) for a pull request that changes it, without pushing it:
# .tekton/reviewer-image.yaml publishes it from main. Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: reviewer-image-check-
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: build
      computeResources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to build.
    workspaces:
      - name: source
    tasks:
      - name: build
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          volumes:
            # BuildKit's state. The image's own VOLUME doesn't work on Container-Optimized OS, which mounts it nosuid.
            - name: buildkit
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet --detach FETCH_HEAD
            - name: build
              image: moby/buildkit:v0.33.1-rootless
              env:
                # Kubernetes can't unmask /proc as rootless BuildKit's process sandbox needs (BuildKit's Kubernetes
                # examples run it this way too).
                - name: BUILDKITD_FLAGS
                  value: --oci-worker-no-process-sandbox
              volumeMounts:
                - name: buildkit
                  mountPath: /home/user/.local/share/buildkit
              # Rootless BuildKit creates user namespaces and mounts, which the default seccomp and AppArmor profiles
              # refuse.
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: Unconfined
                appArmorProfile:
                  type: Unconfined
              script: |
                #!/bin/sh
                set -eu
                buildctl-daemonless.sh build --frontend dockerfile.v0 \
                  --local context=images/reviewer --local dockerfile=images/reviewer
