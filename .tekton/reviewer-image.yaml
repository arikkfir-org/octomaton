# Publishes the pull request reviewer's image (images/reviewer) from a commit on main: built by rootless BuildKit and
# pushed as me-west1-docker.pkg.dev/arikkfir/images/reviewer, tagged with the commit's short SHA and main. The pod
# authenticates to Artifact Registry through Workload Identity as ci-octomaton-release, the one ServiceAccount allowed to
# push, which only main may use (octomaton.dev/branches). Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: reviewer-image-
spec:
  taskRunTemplate:
    serviceAccountName: ci-octomaton-release
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: publish
      computeResources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to publish.
    workspaces:
      - name: source
    tasks:
      - name: publish
        # A lost node kills the build. Pushing the same tags twice is harmless.
        retries: 2
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          volumes:
            - name: docker-config
              emptyDir: {}
            # BuildKit's state. The image's own VOLUME doesn't work on Container-Optimized OS, which mounts it nosuid.
            - name: buildkit
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet --detach FETCH_HEAD
            - name: login
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              volumeMounts:
                - name: docker-config
                  mountPath: /docker-config
              script: |
                #!/bin/sh
                set -eu
                # An hour-long access token of ci-octomaton-release, for BuildKit (UID 1000), which has no gcloud.
                auth="$(printf 'oauth2accesstoken:%s' "$(gcloud auth print-access-token)" | base64 | tr -d '\n')"
                umask 077
                printf '{"auths":{"me-west1-docker.pkg.dev":{"auth":"%s"}}}\n' "$auth" > /docker-config/config.json
                chown -R 1000:1000 /docker-config
            - name: publish
              image: moby/buildkit:v0.33.1-rootless
              env:
                - name: REVISION
                  value: $(params.revision)
                - name: IMAGE
                  value: me-west1-docker.pkg.dev/arikkfir/images/reviewer
                - name: DOCKER_CONFIG
                  value: /docker-config
                # Kubernetes can't unmask /proc as rootless BuildKit's process sandbox needs (BuildKit's Kubernetes
                # examples run it this way too).
                - name: BUILDKITD_FLAGS
                  value: --oci-worker-no-process-sandbox
              volumeMounts:
                - name: docker-config
                  mountPath: /docker-config
                - name: buildkit
                  mountPath: /home/user/.local/share/buildkit
              # Rootless BuildKit creates user namespaces and mounts, which the default seccomp and AppArmor profiles
              # refuse.
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: Unconfined
                appArmorProfile:
                  type: Unconfined
              script: |
                #!/bin/sh
                set -eu
                VERSION=$(printf '%s' "$REVISION" | cut -c1-7)
                echo "Publishing $IMAGE with tags $VERSION and main"
                buildctl-daemonless.sh build --frontend dockerfile.v0 \
                  --local context=images/reviewer --local dockerfile=images/reviewer \
                  --output "type=image,\"name=$IMAGE:$VERSION,$IMAGE:main\",push=true"
