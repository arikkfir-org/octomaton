apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-import
  namespace: octomaton
  labels:
    app.kubernetes.io/name: go-import
  annotations:
    # Restart when the Caddy configuration changes.
    reloader.stakater.com/auto: "true"
spec:
  # Two replicas and a PodDisruptionBudget keep it serving while a node drains.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-import
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-import
    spec:
      automountServiceAccountToken: false
      # Prefer separate nodes, without making the system pool grow.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-import
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # The image gives its caddy binary cap_net_bind_service as a file capability, and the kernel refuses to run
              # such a binary without that capability in the bounding set. Caddy still listens on 8080.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            # The image's XDG_DATA_HOME and XDG_CONFIG_HOME.
            - name: data
              mountPath: /data
            - name: xdg-config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: go-import
        - name: data
          emptyDir: {}
        - name: xdg-config
          emptyDir: {}
