# octomaton.dev, on the public gateway's octomaton-dev listener. The GitHub App's webhook is the only path that reaches
# Octomaton (deliveries are verified with the webhook secret, HMAC); go-import answers everything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octomaton
  namespace: octomaton
  labels:
    app.kubernetes.io/name: octomaton
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: octomaton-dev
  hostnames:
    - octomaton.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /github/hooks
      backendRefs:
        - name: octomaton
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: go-import
          port: 80
