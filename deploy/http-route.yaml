# octomaton.dev, on the public gateway's octomaton-dev listener. The GitHub App's webhook is the only path that reaches
# Octomaton (deliveries are verified with the webhook secret, HMAC). Everything else, the Go import page, is the route
# of delivery's go-import (namespace go-import), which this exact path takes precedence over.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octomaton
  namespace: octomaton
  # Moving to the host's repository (docs/octomaton/designs/host-agnostic.md): never pruned on the way, whichever
  # Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: octomaton-dev
  hostnames:
    - octomaton.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /github/hooks
      backendRefs:
        - name: octomaton
          port: 80
