apiVersion: apps/v1
kind: Deployment
metadata:
  name: octomaton-logs
  namespace: octomaton
  # Octomaton's deploy/ held this until October 2026; a host's Application for deploy/logs/ adopts it by name
  # (docs/octomaton/designs/host-agnostic.md): never pruned on the way, whichever Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: octomaton-logs
spec:
  # One replica, whose PodDisruptionBudget lets a drain evict it: while it restarts, only the logs of pods already gone
  # fail to show. A rollout starts the new pod before it stops the old one.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: octomaton-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octomaton-logs
    spec:
      serviceAccountName: octomaton-logs
      automountServiceAccountToken: false
      # octomaton-logs reads OCTOMATON_* variables: no <SERVICE>_PORT variables from Services in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octomaton-logs
          # No tag here: the host's Application tags it, as it tags octomaton's, and release publishes both images for
          # every commit on main.
          image: me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton-logs
          # Configured by environment variables only, from ConfigMap octomaton-logs, which the host writes: the log
          # view read, the cluster whose containers it serves and its location (the README lists them). Without the
          # ConfigMap the pod waits in CreateContainerConfigError.
          envFrom:
            - configMapRef:
                name: octomaton-logs
          env:
            # Names the pod in exported metrics and traces; octomaton-logs detects the cluster and its location.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.container.name=octomaton-logs
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
