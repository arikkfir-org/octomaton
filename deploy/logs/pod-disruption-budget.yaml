# octomaton-logs has one replica, which a drain still evicts, ready or not: under the default policy a single replica's
# budget refuses to evict an unready pod, holding the drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: octomaton-logs
  namespace: octomaton
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: octomaton-logs
