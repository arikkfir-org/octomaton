# octomaton-logs: the logs of CI steps whose pods are gone, read from Cloud Logging, for the Tekton Dashboard's external
# logs (the host points them at http://octomaton-logs.octomaton.svc.cluster.local/logs). It reads as the cloud identity
# the host binds to this ServiceAccount, which holds roles/logging.viewAccessor on the log view it reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: octomaton-logs
  namespace: octomaton
  labels:
    app.kubernetes.io/name: octomaton-logs
# It calls no Kubernetes API, and Workload Identity needs no token in the pod.
automountServiceAccountToken: false
