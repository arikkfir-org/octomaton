# Octomaton's namespace, where pods meet the restricted Pod Security Standard. A host adds its own labels with a patch
# (the hub's admission to its public gateway, say). Argo CD never deletes or prunes it: Octomaton runs every
# repository's CI, the fix for its own included.
apiVersion: v1
kind: Namespace
metadata:
  name: octomaton
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
