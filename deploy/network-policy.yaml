apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octomaton
  namespace: octomaton
  # Moving to the host's repository (docs/octomaton/designs/host-agnostic.md): never pruned on the way, whichever
  # Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octomaton
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
