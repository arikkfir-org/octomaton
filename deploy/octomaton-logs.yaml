# octomaton-logs: the logs of CI steps whose pods are gone, read from Cloud Logging, for the Tekton Dashboard's external
# logs (delivery's TektonConfig points them at http://octomaton-logs.octomaton.svc.cluster.local/logs). It reads as the
# Workload Identity principal of its ServiceAccount, which holds roles/logging.viewAccessor on the log view it reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: octomaton-logs
  namespace: octomaton
  # Moving to deploy/logs/, under an Application of its own (docs/octomaton/designs/host-agnostic.md): never pruned
  # on the way, whichever Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton-logs
# It calls no Kubernetes API, and Workload Identity needs no token in the pod.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octomaton-logs
  namespace: octomaton
  # Moving to deploy/logs/, under an Application of its own (docs/octomaton/designs/host-agnostic.md): never pruned
  # on the way, whichever Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton-logs
spec:
  # One replica, whose PodDisruptionBudget lets a drain evict it: while it restarts, only the logs of pods already gone
  # fail to show. A rollout starts the new pod before it stops the old one.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: octomaton-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octomaton-logs
    spec:
      serviceAccountName: octomaton-logs
      automountServiceAccountToken: false
      # octomaton-logs reads OCTOMATON_* variables: no <SERVICE>_PORT variables from Services in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octomaton-logs
          # No tag here: Argo CD sets it to the short SHA of the commit it deploys, as for octomaton's, and release
          # publishes both images for every commit on main.
          image: me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton-logs
          # Configured by environment variables only; the README lists them. Its settings are moving to ConfigMap
          # octomaton-logs, which the host writes (docs/octomaton/designs/host-agnostic.md): optional until it does.
          envFrom:
            - configMapRef:
                name: octomaton-logs
                optional: true
          env:
            # The log view read, whose project is the quota project, and the cluster whose containers it serves.
            - name: OCTOMATON_LOGS_VIEW
              value: projects/arikkfir/locations/global/buckets/_Default/views/_Default
            - name: OCTOMATON_LOGS_CLUSTER
              value: hub
            - name: OCTOMATON_LOGS_LOCATION
              value: me-west1-a
            # Names the pod in exported metrics and traces; octomaton-logs detects the cluster and its location.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.container.name=octomaton-logs
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: octomaton-logs
  namespace: octomaton
  # Moving to deploy/logs/, under an Application of its own (docs/octomaton/designs/host-agnostic.md): never pruned
  # on the way, whichever Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton-logs
spec:
  selector:
    app.kubernetes.io/name: octomaton-logs
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Only the Tekton Dashboard's pods reach octomaton-logs: it has no route, and the Dashboard's backend is its one client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octomaton-logs
  namespace: octomaton
  # Moving to the host's repository (docs/octomaton/designs/host-agnostic.md): never pruned
  # on the way, whichever Application synced last.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton-logs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octomaton-logs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tekton-pipelines
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard
      ports:
        - protocol: TCP
          port: 8080
